<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="V — a distorted world, unfolding in volumes. Evan Butler.">
  <meta name="color-scheme" content="light dark">
  <title>V — Evan Butler</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/v.css?v=5">
</head>
<body>
<div class="page-transition" id="pageTransition"></div>

<header>
  <a href="index.html" class="brand">Distortion</a>
  <div class="menu-btn"></div>
  <div class="navigation">
    <div class="navigation-items">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="exhibition.html">Exhibition</a>
      <a href="v.html" class="active">V</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</header>

<main class="volumes">
  <picture class="volumes-mark">
    <source media="(prefers-color-scheme: dark)" srcset="assets/images/VMark-white.jpg">
    <img src="assets/images/VMark-black.jpg" alt="V">
  </picture>
  <p class="volumes-intro">V is a world that was supposed to be faithful to reality — until a distortion appeared.</p>
  <div class="volume-row" id="volumeRow">
    <button class="volume-arrow prev" id="volumePrev" type="button" aria-label="Previous volume">&#8249;</button>
    <div class="volume-stage" id="volumeStage">
      <div class="orbit-ring" aria-hidden="true"></div>
      <figure class="volume-card" data-title="Volume 1" data-page="volume1.html">
        <img src="assets/images/Volume1Cover.jpg" alt="Volume 1 — Breaking">
      </figure>
      <figure class="volume-card" data-title="Volume 2" data-page="volume2.html">
        <img src="assets/images/Volume2AltCover.jpg?v=1" alt="Volume 2 — Tanpeki, Baby, close your eyes">
      </figure>
      <figure class="volume-card" data-title="Volume 3" data-page="volume3.html">
        <img src="assets/images/Volume3Cover.jpg" alt="Volume 3 — Vermillion Zyu Hung">
      </figure>
      <figure class="volume-card" data-title="Volume 4" data-coming-soon>
        <img src="assets/images/Volume4Cover.jpg?v=2" alt="Volume 4 — Pierrot">
        <span class="coming-soon">Coming soon</span>
      </figure>
    </div>
    <button class="volume-arrow next" id="volumeNext" type="button" aria-label="Next volume">&#8250;</button>
  </div>
  <h1 class="volume-title" id="volumeTitle" aria-live="polite">Volume 1</h1>
  <a class="books-bar" href="books.html">
    <span class="books-bar-label">Books</span>
    <span class="books-bar-arrow">&rarr;</span>
  </a>
</main>

<script type="text/javascript">
    //Javacript for responsive navigation menu
    const menuBtn = document.querySelector(".menu-btn");
    const navigation = document.querySelector(".navigation");

    menuBtn.addEventListener("click", () => {
      menuBtn.classList.toggle("active");
      navigation.classList.toggle("active");
    });
</script>

<script>
const pageTransition = document.getElementById('pageTransition');

window.addEventListener('DOMContentLoaded', () => {
  requestAnimationFrame(() => {
    pageTransition.classList.add('fade-in');
  });
});

document.querySelectorAll('a[href]').forEach(link => {
  const href = link.getAttribute('href');
  const isInternal = href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('mailto:');

  if (isInternal){
    link.addEventListener('click', (e) => {
      e.preventDefault();
      pageTransition.classList.remove('fade-in');
      pageTransition.classList.add('fade-out');

      setTimeout(() => {
        window.location.href = href;
      }, 600);
    });
  }
});
</script>

<script src="js/lang.js"></script>
<script src="js/menu.js"></script>
<script src="js/volumes.js?v=4"></script>
</body>
</html>
