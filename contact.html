<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Evan Butler</title>
  <meta name="description" content="Contact Evan Butler for exhibition and press inquiries. Brooklyn, New York.">
  <link rel="stylesheet" href="css/aboutstyle.css">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css">
</head>
<body>
<div class="page-transition" id="pageTransition"></div>

<header>
  <a href="index.html" class="brand">The Atelier</a>
  <div class="menu-btn"></div>
  <div class="navigation">
    <div class="navigation-items">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="exhibition.html">Exhibition</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</header>

<section class="contact-info">
  <div class="contact-box">
    <h1>Contact</h1>
    <div class="contact-place">New York, Brooklyn</div>

    <hr class="section-divider">

    <p class="contact-lead">For exhibition and press inquiries:</p>
    <a class="contact-email" href="mailto:bishopb429@gmail.com">bishopb429@gmail.com</a>

    <hr class="section-divider">

    <a class="contact-link" href="https://www.instagram.com/evan.t.butler/">Instagram — @evan.t.butler</a>
  </div>
</section>

<div class="media-icons">
  <a href="https://www.facebook.com/evan.butler.9619"><i class="fab fa-facebook-f"></i></a>
  <a href="https://www.instagram.com/evan.t.butler"><i class="fab fa-instagram"></i></a>
</div>

<script>
const menuBtn = document.querySelector(".menu-btn");
const navigation = document.querySelector(".navigation");
menuBtn.addEventListener("click", () => {
  menuBtn.classList.toggle("active");
  navigation.classList.toggle("active");
});
</script>

<script>
const pageTransition = document.getElementById('pageTransition');
window.addEventListener('DOMContentLoaded', () => {
  requestAnimationFrame(() => { pageTransition.classList.add('fade-in'); });
});
document.querySelectorAll('a[href]').forEach(link => {
  const href = link.getAttribute('href');
  const isInternal = href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('mailto:');
  if (isInternal){
    link.addEventListener('click', (e) => {
      e.preventDefault();
      pageTransition.classList.remove('fade-in');
      pageTransition.classList.add('fade-out');
      setTimeout(() => { window.location.href = href; }, 600);
    });
  }
});
</script>

<script src="js/lang.js"></script>
</body>
</html>
