<script>
const pageTransition = document.getElementById('pageTransition');

window.addEventListener('DOMContentLoaded', () => {
  requestAnimationFrame(() => {
    pageTransition.classList.add('fade-in');
  });
});

document.querySelectorAll('a[href]').forEach(link => {
  const href = link.getAttribute('href');
  const isInternal = href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('mailto:');

  if (isInternal){
    link.addEventListener('click', (e) => {
      e.preventDefault();
      pageTransition.classList.remove('fade-in');
      pageTransition.classList.add('fade-out');

      setTimeout(() => {
        window.location.href = href;
      }, 600);
    });
  }
});
</script>

<script>
// The cover link, shop link, and status pills follow the site's language:
// lang.js records the JP/EN toggle on <html lang>. Show the matching
// text on load and whenever the toggle changes.
(function () {
  var shopEn = document.getElementById('shopLinkEn');
  var shopJa = document.getElementById('shopLinkJa');
  var statusBabyEn = document.getElementById('statusBabyEn');
  var statusBabyJa = document.getElementById('statusBabyJa');
  var statusModelEn = document.getElementById('statusModelEn');
  var statusModelJa = document.getElementById('statusModelJa');
  var babyCoverLink = document.getElementById('babyCoverLink');
  function show(lang) {
    var isJa = lang === 'ja';
    if (shopEn) shopEn.hidden = isJa;
    if (shopJa) shopJa.hidden = !isJa;
    if (statusBabyEn) statusBabyEn.hidden = isJa;
    if (statusBabyJa) statusBabyJa.hidden = !isJa;
    if (statusModelEn) statusModelEn.hidden = isJa;
    if (statusModelJa) statusModelJa.hidden = !isJa;
    if (babyCoverLink) babyCoverLink.href = isJa ? 'baby-close-your-eyes-ja.html' : 'baby-close-your-eyes.html';
  }
  show(document.documentElement.lang || 'en');
  if (window.MutationObserver) {
    new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        if (m.attributeName === 'lang') show(document.documentElement.lang);
      });
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  }
})();
</script>

<script>
// Safari-style header: the header slides away while scrolling down and
// returns when scrolling up. This page scrolls inside <body> (the site
// sets html/body to 100vh), so listen to the body's scroll, not the window's.
(function () {
  var header = document.querySelector('header');
  var navigation = document.querySelector('.navigation');
  var lastY = 0;
  function onScroll() {
    var y = document.body.scrollTop;
    var menuOpen = navigation && navigation.classList.contains('active');
    if (!menuOpen && y > 140 && y > lastY + 6) {
      header.classList.add('header-hidden');
    } else if (y < lastY - 6 || y <= 140) {
      header.classList.remove('header-hidden');
    }
    header.classList.toggle('header-scrolled', y > 40);
    lastY = y;
  }
  document.body.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
